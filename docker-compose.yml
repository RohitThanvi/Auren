# Development infrastructure. Not a production deployment (see docs/DEVELOPMENT.md).
# All credentials come from .env (copy .env.example); nothing secret is stored in this file.
# POSTGRES_PASSWORD must be URL-safe because it is embedded in the database URL below.

x-api-environment: &api-environment
  AUREN_ENVIRONMENT: ${AUREN_ENVIRONMENT:-development}
  AUREN_LOG_LEVEL: ${AUREN_LOG_LEVEL:-INFO}
  AUREN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
  AUREN_REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-environment
      AUREN_CLERK_ISSUER: ${AUREN_CLERK_ISSUER:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      <<: *api-environment
      AUREN_HOST: 0.0.0.0
      AUREN_PORT: "8000"
      AUREN_CORS_ALLOWED_ORIGINS: ${AUREN_CORS_ALLOWED_ORIGINS:-}
      AUREN_TRUSTED_PROXY_COUNT: ${AUREN_TRUSTED_PROXY_COUNT:-0}
      AUREN_CLERK_ISSUER: ${AUREN_CLERK_ISSUER:?set in .env}
      AUREN_CLERK_AUTHORIZED_PARTIES: ${AUREN_CLERK_AUTHORIZED_PARTIES:-}
      AUREN_CLERK_AUDIENCE: ${AUREN_CLERK_AUDIENCE:-}
      AUREN_RATE_LIMIT_ANONYMOUS: ${AUREN_RATE_LIMIT_ANONYMOUS:-60/60}
      AUREN_RATE_LIMIT_AUTHENTICATED: ${AUREN_RATE_LIMIT_AUTHENTICATED:-120/60}
      AUREN_RATE_LIMIT_AUTH: ${AUREN_RATE_LIMIT_AUTH:-10/60}
      AUREN_RATE_LIMIT_TICKET_CREATION: ${AUREN_RATE_LIMIT_TICKET_CREATION:-10/60}
      AUREN_RATE_LIMIT_SESSION_CREATION: ${AUREN_RATE_LIMIT_SESSION_CREATION:-5/60}
      AUREN_RATE_LIMIT_UPLOAD: ${AUREN_RATE_LIMIT_UPLOAD:-10/600}
      AUREN_RATE_LIMIT_EXPENSIVE: ${AUREN_RATE_LIMIT_EXPENSIVE:-5/60}
      AUREN_RATE_LIMIT_FAIL_OPEN: ${AUREN_RATE_LIMIT_FAIL_OPEN:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
